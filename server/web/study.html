<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Study Buddy</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='lg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23ff3b5c'/%3E%3Cstop offset='1' stop-color='%233b5bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect x='6' y='6' width='88' height='88' rx='30' fill='url(%23lg)'/%3E%3Crect x='31' y='33' width='10' height='18' rx='5' fill='%23fff'/%3E%3Cpath d='M55 46q8-9 16 0M38 68q12 8 24 0' fill='none' stroke='%23fff' stroke-width='7' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/study.css?v=9">
</head>
<body>
<header class="top">
  <div class="top-left"><a class="to-buddy" href="/" title="Back to Buddy">← Buddy</a><a class="brand" href="#/"><svg class="logo" viewBox="0 0 100 100" aria-hidden="true"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff3b5c"/><stop offset="1" stop-color="#3b5bff"/></linearGradient></defs><rect x="6" y="6" width="88" height="88" rx="30" fill="url(#lg)"/><rect x="31" y="33" width="10" height="18" rx="5" fill="#fff"/><path d="M55 46q8-9 16 0M38 68q12 8 24 0" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/></svg><span>Study</span></a></div>
  <button id="me" class="me" hidden aria-haspopup="menu"></button>
  <div id="me-menu" class="menu" role="menu" hidden>
    <button data-act="switch" role="menuitem">Switch person</button>
    <button data-act="delete" role="menuitem" class="danger">Delete my profile…</button>
  </div>
</header>

<main id="view" aria-live="polite"></main>

<!-- PIN pad -->
<div id="pin" class="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="pin-title">
    <h2 id="pin-title"></h2>
    <p id="pin-hint" class="muted"></p>
    <div class="pin-dots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <p id="pin-error" class="error" role="alert"></p>
    <div class="pad">
      <button>1</button><button>2</button><button>3</button>
      <button>4</button><button>5</button><button>6</button>
      <button>7</button><button>8</button><button>9</button>
      <button data-k="cancel" class="ghost">Cancel</button><button>0</button><button data-k="back" class="ghost" aria-label="Delete">⌫</button>
    </div>
  </div>
</div>

<script src="/static/study.js?v=8"></script>
</body>
</html>
